- name: Install Docker
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    update_cache: yes
    state: present

- name: Start and enable Docker service
  service:
    name: docker
    state: started
    enabled: yes

- name: Ensure docker group exists
  group:
    name: docker
    state: present

- name: Add current user to docker group
  user:
    name: "{{ web01_user }}"
    groups: docker
    append: true

- name: Reset connection to apply group membership
  meta: reset_connection

- name: Copy docker compose file
  copy:
    src: "{{ dcompose_path }}"
    dest: /home/{{ ansible_user }}/{{ my_project }}/docker-compose.yml
    owner: "{{ web01_user }}"
    group: "{{ web01_user }}"