global:
  scrape_interval: 15s
  log_level: warn
  
scrape_configs:
  - job_name: 'node_exporter'    
    static_configs:
      - targets: ['localhost:9100']  
  
remote_write:
  - url: "https://prometheus-prod-24-prod-eu-west-2.grafana.net/api/prom/push"
    basic_auth:
      username: ${GRAFANA_USERNAME}
      password: ${GRAFANA_API_TOKEN} 