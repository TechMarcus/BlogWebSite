global:
  scrape_interval: 20s
  
scrape_configs:
  - job_name: 'node_exporter'    
    static_configs:
      - targets: ['node-exporter:9100']  

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
  
remote_write:
  - url: "https://prometheus-prod-24-prod-eu-west-2.grafana.net/api/prom/push"
    basic_auth:
      username: ${PROMETHEUS_USERNAME}
      password: ${PROMETHEUS_API_TOKEN}