name: Application Pipeline
on:
  push:
    branches: [staging, test]
    paths:
      - 'app/**'

jobs:
  test-job:
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          sparse-checkout: "app"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          cd app/backend
          pip install -r requirements.txt
          pip install ruff pytest
          ruff check .
        # pytest
  
  build-containers:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          sparse-checkout: "app"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        run: echo "${{ secrets.DOCKER_PSWD }}" | docker login -u "${{ secrets.DOCKER_NAME }}" --password-stdin

      - name: Build Docker images
        run: |
            docker build app/backend -t ${{ secrets.DOCKER_NAME }}/blog-backend:latest
          # docker build app/frontend -t ${{ secrets.DOCKER_NAME }}/blog-frontend:latest

      - name: Push image to DockerHub
        run: |
            docker push ${{ secrets.DOCKER_NAME }}/blog-backend:latest
          # docker push ${{ secrets.DOCKER_NAME }}/blog-frontend:latest
  
  deploy-containers:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    needs: build-containers
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRIVATE_KEY_WEB01 }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ vars.PUBLIC_IP_WEB01 }} >> ~/.ssh/known_hosts

      - name: Remote run
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ vars.WEB01_USER }}@${{ vars.PUBLIC_IP_WEB01 }} '
          cd BlogWebSite/
          echo "${{ secrets.DOCKER_PSWD }}" | docker login -u "${{ secrets.DOCKER_NAME }}" --password-stdin
          env $(echo "$ENV_CONTENT" | xargs) docker compose up -d
          env:
            ENV_CONTENT: ${{ secrets.ENV_CONTENT }}
          '